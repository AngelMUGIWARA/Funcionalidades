<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<form>
  <h2>Formulario Random</h2>

  <label for="nombre">¿Cómo se llama tu mascota?</label><br>
  <input type="text" id="nombre" name="nombre"><br><br>

  <label for="comida">¿Cuál es tu novela favorita?</label><br>
  <input type="text" id="comida" name="comida"><br><br>

  <label for="animal">Si fueras un utencilio de cocina, ¿cuál serías?</label><br>
  <select id="animal" name="utencilio">
    <option value="sarten">Sarten</option>
    <option value="miserable">Miserable</option>
    <option value="olla">Olla</option>
    <option value="olla2">Olla Express</option>
    <option value="estufa">Estufa</option>
  </select><br><br>

  <label>¿Pizza con piña?</label><br>
  <input type="radio" id="si" name="pizza" value="si">
  <label for="si">Sí</label>

  <input type="radio" id="no" name="pizza" value="no">
  <label for="no">No</label><br><br>

  <label for="superpoder">¿Qué superpoder elegirías?</label><br>
  <input type="text" id="superpoder" name="superpoder"><br><br>

  <button type="submit">Enviar respuestas</button>
</form>

</body>
</html>
