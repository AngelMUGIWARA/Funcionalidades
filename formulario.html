<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Formulario Random</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">Misiones</a>

        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
            aria-controls="navbarNav"
            aria-expanded="false"
            aria-label="Toggle navigation"
        >
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="./index.html">Inicio</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active" href="./formulario.html">Formulario</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="./cartas.html">Cartas</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">

            <div class="card shadow border-0">
                <div class="card-body p-4">

                    <h2 class="text-center mb-4">
                        Formulario Random
                    </h2>

                    <form>

                        <!-- Mascota -->
                        <div class="mb-3">
                            <label for="nombre" class="form-label">
                                ¿Cómo se llama tu mascota?
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="nombre"
                                name="nombre"
                                placeholder="Ej. Firulais"
                            >
                        </div>

                        <!-- Novela -->
                        <div class="mb-3">
                            <label for="comida" class="form-label">
                                ¿Cuál es tu novela favorita?
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="comida"
                                name="comida"
                                placeholder="Escribe tu novela favorita"
                            >
                        </div>

                        <!-- Utensilio -->
                        <div class="mb-3">
                            <label for="animal" class="form-label">
                                Si fueras un utensilio de cocina, ¿cuál serías?
                            </label>

                            <select
                                id="animal"
                                name="utensilio"
                                class="form-select"
                            >
                                <option selected disabled>
                                    Selecciona una opción
                                </option>

                                <option value="sarten">Sartén</option>
                                <option value="miserable">Miserable</option>
                                <option value="olla">Olla</option>
                                <option value="olla2">Olla Express</option>
                                <option value="estufa">Estufa</option>
                            </select>
                        </div>

                        <!-- Pizza -->
                        <div class="mb-3">

                            <label class="form-label">
                                ¿Pizza con piña?
                            </label>

                            <div class="form-check">
                                <input
                                    class="form-check-input"
                                    type="radio"
                                    id="si"
                                    name="pizza"
                                    value="si"
                                >

                                <label class="form-check-label" for="si">
                                    Sí
                                </label>
                            </div>

                            <div class="form-check">
                                <input
                                    class="form-check-input"
                                    type="radio"
                                    id="no"
                                    name="pizza"
                                    value="no"
                                >

                                <label class="form-check-label" for="no">
                                    No
                                </label>
                            </div>

                        </div>

                        <!-- Superpoder -->
                        <div class="mb-4">
                            <label for="superpoder" class="form-label">
                                ¿Qué superpoder elegirías?
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="superpoder"
                                name="superpoder"
                                placeholder="Ej. Teletransportación"
                            >
                        </div>

                        <!-- Botón -->
                        <div class="d-grid">
                            <button
                                type="submit"
                                class="btn btn-primary btn-lg"
                            >
                                Enviar respuestas
                            </button>
                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
